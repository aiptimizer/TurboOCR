site_name: TurboOCR
site_description: "The fastest GPU document parser — OCR, layout, tables, formulas to Markdown on NVIDIA, Apple, Intel and CPU"
site_author: ""
site_url: "https://aiptimizer.github.io/TurboOCR/"

docs_dir: docs
site_dir: site

repo_url: https://github.com/aiptimizer/TurboOCR
repo_name: aiptimizer/TurboOCR
edit_uri: ""

copyright: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - navigation.instant
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/install-selector.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aiptimizer/TurboOCR
      name: Source on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

plugins:
  - search
  - mermaid2:
      arguments:
        theme: base
        themeVariables:
          primaryColor: "#1e293b"
          primaryTextColor: "#f1f5f9"
          primaryBorderColor: "#475569"
          lineColor: "#64748b"
          secondaryColor: "#334155"
          tertiaryColor: "#0f172a"
          fontSize: "14px"
          fontFamily: "Inter, system-ui, sans-serif"

# Ordered the way a reader arrives: run it → use it → look things up →
# understand the models → understand the design → check the numbers →
# change it. Engineering logs come last and are labelled as logs.
nav:
  - Home: index.md
  - Get started:
      - Install: getting-started/install.md
      - Run with Docker: getting-started/docker.md
      - Build natively: getting-started/native.md
      - Build on Windows: guides/windows-native-build.md
      - Fetch the model bundle: getting-started/model-bundle.md
  - Guides:
      - What changed in v4: guides/upgrading-v4.md
      - PaddleOCR-VL on a separate GPU: guides/vl-separate-gpu.md
      - Upgrading to v3: guides/upgrading-v3.md
      - Running legacy PP-OCRv5: guides/legacy-ppocrv5.md
  - Reference:
      - HTTP API: reference/http.md
      - gRPC API: reference/grpc.md
      - Python library: reference/python.md
      - Configuration: reference/configuration.md
      - Markdown output: reference/markdown-output.md
      - Metrics & monitoring: reference/monitoring.md
  - Models:
      - Choosing a model: models/selection.md
      - Detection: models/detection.md
      - Classification: models/classification.md
      - Layout: models/layout.md
      - Recognition: models/recognition.md
      - Table: models/table.md
      - Formula: models/formula.md
      - Form fields: models/forms.md
      - How the stages interact: models/interactions.md
  - Architecture:
      - Overview: architecture/overview.md
      - Pipeline: architecture/pipeline.md
      - CUDA streams: architecture/cuda-streams.md
      - Router: architecture/router.md
      - Multi-backend seam: architecture/multi-backend.md
  - Benchmarks:
      - OmniDocBench: benchmarks/omnidocbench.md
      - Speed vs accuracy: benchmarks/speed-vs-accuracy.md
      - Latency: benchmarks/latency.md
      - Engine comparison: benchmarks/comparison.md
      - The benchmark corpus: benchmarks/corpus.md
  - Contributing:
      - Running the tests: contributing/testing.md
      - Testing strategy: contributing/testing-strategy.md
      - Adding a backend: contributing/adding-a-backend.md
      - Pre-commit checks: contributing/pre-commit.md
      - Publishing the model bundle: contributing/model-release.md
  - Engineering log:
      - Production readiness (2026-07): notes/production-readiness-2026-07.md
      - Apple backend bring-up: notes/apple-backend-log.md
      - Plan history: notes/plan-history.md
