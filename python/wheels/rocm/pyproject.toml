# turboocr-engine-rocm — the AMD wheel.
#
# Same source tree, same `turboocr_engine` import package, same `_turboocr` extension
# as the base wheel (../../pyproject.toml). ONLY the distribution name and the
# CMake args differ: the execution provider is COMPILED IN, so one wheel is one
# engine. Install exactly ONE turboocr-engine-* wheel per environment — the
# cpu, cuda, openvino and rocm engine wheels all own the same `turboocr_engine`
# import name and the same `turboocr` console script, so two of them
# in one site-packages is last-writer-wins, not a merge.
#
# STATUS: the AMD backend is hardware-verified on MI300X (2026-08-26: all
# goldens + conformance + FUNSD F1 85.15%, tiny 105.5 img/s; the Python suite
# is green on hardware — src/backends/amd/BRINGUP.md). The WHEEL itself has
# been built but not yet pip-installed and run on an AMD box; publish after
# that one check.
#
# THIS FILE IS STAGED, NOT BUILT IN PLACE. It is the canonical config for the
# AMD variant, but the build copies it OVER python/pyproject.toml (backing the
# base up first) and builds python/:
#
#   scripts/python/build_backend_wheel.sh rocm
#
# Every path below is therefore written RELATIVE TO python/, exactly as in the
# base config — `cmake.source-dir = ".."`, `wheel.packages = ["turboocr_engine"]`,
# version input `turboocr_engine/_version.py`. Do NOT "fix" them into ../../.. escapes
# pointing at this directory: a cibuildwheel container only mounts the package
# directory, so an escaping path resolves to nothing there. Building this
# directory directly (`pip wheel python/wheels/rocm`) is NOT supported.
# See ../README.md.
[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "turboocr-engine-rocm"
dynamic = ["version"]
description = "Fast multi-backend OCR (PP-OCRv6) for Python — AMD build: ROCm/HIP + MIGraphX"
readme = { content-type = "text/markdown", text = """
# turboocr-engine-rocm

The AMD build of [TurboOCR](https://turboocr.com). Identical Python API to the
`turboocr-engine-cpu` wheel — `from turboocr_engine import OCR`, or
`from turboocr import OCR` through the pure-Python `turboocr` umbrella
(`pip install "turboocr[rocm]"` installs both) — with the AMD backend
compiled into the native extension: HIP kernels and the native MIGraphX engine
(hardware-verified on MI300X). The bundled ONNX Runtime is the CPU build, so
`engine_mode="onnx"` runs on CPU; the GPU MIGraphX execution provider needs a
ROCm ONNX Runtime, which this wheel deliberately does not bundle (multi-GB).

Needs a ROCm installation on the host. **Install exactly one**
`turboocr-engine-*` wheel per environment: they all provide the
`turboocr_engine` import package and link
mutually incompatible ONNX Runtime builds. `turboocr doctor` reports which
engine the installed wheel actually carries.
""" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TurboOCR" }]
keywords = ["ocr", "paddleocr", "onnx", "onnxruntime", "rocm", "migraphx", "amd", "pdf", "document-parsing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Same rule as the base wheel: ONNX Runtime, OpenCV and PDFium are LINKED INTO
# `_turboocr` and vendored by the repair step, so they are not Python deps.
# The ROCm runtime (libamdhip64, MIGraphX, rocBLAS, MIOpen, ...) is deliberately
# NOT vendored and NOT listed here either — it comes from the host ROCm
# installation (see the repair excludes in
# scripts/python/build_backend_wheel.sh).
dependencies = [
    "numpy>=1.21",
    "opencv-python-headless>=4.6",
    "pypdfium2>=4",
    "reportlab>=3.6",
]

[project.optional-dependencies]
pdf = ["pypdfium2>=4", "reportlab>=3.6"]
rich = ["rich>=13"]
pandas = ["pandas>=1.3", "lxml>=4.9"]  # lxml: the read_html parser for TableRegion.to_pandas()
all = ["pypdfium2>=4", "reportlab>=3.6", "rich>=13", "pandas>=1.3", "lxml>=4.9"]

[project.scripts]
turboocr = "turboocr_engine.cli:main"

# Unchanged from the base wheel on purpose: same project, different build.
[project.urls]
Homepage = "https://turboocr.com"
Repository = "https://github.com/aiptimizer/TurboOCR"

[tool.scikit-build]
minimum-version = "1.0"
# Per-variant build tree. NOT shared with the base wheel's
# build-wheels/skbuild-*: USE_CPU_ONLY and TURBO_BACKENDS are CMake CACHE
# variables, so reusing one directory across variants would silently rebuild
# the previous variant's configuration.
build-dir = "../build-wheels/skbuild-rocm-{wheel_tag}"
# Staged at python/pyproject.toml, so one level up is the repo root — the same
# C++ tree the base wheel builds.
cmake.source-dir = ".."
# AMD takes the ONNX-Runtime HOST path, like every backend except nvidia.
# USE_CPU_ONLY is a misnomer for that path (CMakeLists.txt:262-266) and is
# already IMPLIED by a backend list without nvidia (CMakeLists.txt:279-287);
# it is stated anyway so all four wheel configs read the same way.
# `cpu` rides along as the runtime fallback backend (one binary, vendor chosen
# at run time by --backend / TURBO_BACKEND).
#
# BUILD INPUTS this configure requires on the CI image — they are NOT pip
# dependencies and cannot be expressed here:
#   * ROCm: find_package(hip) + find_package(migraphx) + CMake's HIP language
#     (hipcc). Pass -DCMAKE_PREFIX_PATH=/opt/rocm if they are not on the
#     default path, and -DCMAKE_HIP_ARCHITECTURES=<gfx...> for the GPUs the
#     wheel should ship code for.
#   * an ONNX Runtime built with the MIGraphX/ROCm execution provider (the
#     repo.radeon.com build), in third_party/onnxruntime or /usr/local, or
#     -DONNXRUNTIME_LIB=... plus -DONNXRUNTIME_INCLUDE_DIR=.... A stock ORT
#     still BUILDS here (the native MIGraphX engine is independent of it) but
#     the shared ONNX fast path would then fall back to the default provider.
# Pass those through the CMAKE_ARGS environment variable, which
# scikit-build-core appends AFTER this list.
cmake.args = [
    "-DBUILD_PYTHON=ON",
    "-DBUILD_SERVER=OFF",
    "-DUSE_CPU_ONLY=ON",
    "-DTURBO_BACKENDS=cpu;amd",
]
build.targets = ["_turboocr"]
install.components = ["python"]
# The pure-Python package is the SAME directory the base wheel ships; there is
# no copy of it under wheels/. Staged, this resolves to python/turboocr_engine.
wheel.packages = ["turboocr_engine"]
# abi3, as in the base config: nanobind_add_module(_turboocr STABLE_ABI)
# already compiles against the 3.12 limited API, but without py-api the wheel
# is still tagged cp3XY-cp3XY — one wheel per interpreter for a binary that
# needs one. Ignored (with a plain cp3XY-cp3XY tag) when the build interpreter
# is older than 3.12, so a source build cannot be mistagged by it.
wheel.py-api = "cp312"
# Never ship a stale local build: `wheel.packages` copies python/turboocr_engine as it
# is on disk, and scikit-build-core does not read the repo-root .gitignore
# (only .gitignore files at or below python/).
#
# These are `sdist.exclude`, NOT `wheel.exclude`, and the two are not
# interchangeable. sdist.exclude is passed as `src_exclude` and filters ONLY
# the walk of the SOURCE package directory, so the worst it can do is skip a
# copy out of python/turboocr_engine/. `wheel.exclude` is additionally applied at zip
# time to every staged tree INCLUDING the CMake install tree, where a
# `turboocr_engine/_turboocr*.so` pattern would delete the freshly built extension
# that `install(TARGETS _turboocr ... DESTINATION turboocr_engine)` just placed at
# that exact path. The fresh module never enters the source walk, so nothing
# below can reach it. Full argument in ../../pyproject.toml.
sdist.exclude = [
    "turboocr_engine/_turboocr*.so",
    "turboocr_engine/_turboocr*.pyd",
    "turboocr_engine/_turboocr*.dylib",
    "turboocr_engine/*.metallib",
]
# Must NOT name the package directory: an include is checked BEFORE the user
# exclude, and a bare `turboocr_engine` would match every file under it and defeat
# every pattern above.
sdist.include = ["README.md", "pyproject.toml"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
# Same single source of truth as the base wheel: python/turboocr_engine/_version.py.
input = "turboocr_engine/_version.py"

[tool.cibuildwheel]
# abi3 via nanobind STABLE_ABI: one cp312 build covers every later CPython.
build = "cp312-*"
skip = "*-musllinux*"

[tool.cibuildwheel.linux]
# ROCm is Linux/x86_64 only.
archs = ["x86_64"]
# NOTE: the repair step must EXCLUDE the host ROCm sonames (libamdhip64,
# libmigraphx*, librocblas, libMIOpen, libhsa-runtime64, librocm_smi64) so they
# are not vendored into the wheel. That exclude list lives in
# scripts/python/build_backend_wheel.sh; point CIBW_REPAIR_WHEEL_COMMAND at
# that logic rather than duplicating it here.
