name: "Set up C++ build deps"
description: >-
  Install the native CPU build dependencies on an Ubuntu runner: apt packages,
  Drogon (built from source — not packaged) and the ONNX Runtime C++ SDK into a
  dedicated, cacheable prefix, plus vendored PDFium. Mirrors docker/Dockerfile.cpu
  so CI and the image agree.

runs:
  using: "composite"
  steps:
    - name: APT packages
      shell: bash
      run: |
        # Mirror stalls are the #1 cause of cancelled CI jobs here: apt would
        # sit on a dead archive.ubuntu.com connection with NO timeout until the
        # 30-minute job limit killed the whole run (observed repeatedly, e.g.
        # a hang right after the InRelease fetches). Three defenses, all bounded:
        #   - hard network timeouts + retries INSIDE apt, so a dead mirror
        #     fails in seconds and is retried instead of hanging forever;
        #   - force IPv4 (runner IPv6 to the archive is a known stall mode);
        #   - one bounded outer retry loop with `timeout` as the backstop, so
        #     the step's worst case is ~7 minutes, never the job limit.
        # Persist the acquire settings machine-wide so every LATER apt call in
        # the same job (clang-tidy/cppcheck installs etc.) inherits them too.
        printf '%s\n' \
          'Acquire::Retries "5";' \
          'Acquire::http::Timeout "30";' \
          'Acquire::https::Timeout "30";' \
          'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99turbo-ci >/dev/null
        APT_OPTS=(-o Acquire::Retries=5
                  -o Acquire::http::Timeout=30
                  -o Acquire::https::Timeout=30
                  -o Acquire::ForceIPv4=true)
        apt_bounded() {
          local attempt
          for attempt in 1 2 3; do
            if sudo timeout 420 apt-get "${APT_OPTS[@]}" "$@"; then
              return 0
            fi
            echo "::warning::apt-get $1 attempt ${attempt} failed/stalled; retrying"
            sleep 10
          done
          return 1
        }
        apt_bounded update
        apt_bounded install -y --no-install-recommends \
          build-essential cmake ninja-build pkg-config \
          libopencv-dev libwebp-dev libturbojpeg0-dev \
          libgrpc++-dev libc-ares-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
          libjsoncpp-dev uuid-dev zlib1g-dev libssl-dev \
          git wget curl ca-certificates

    # Cache ONLY the dedicated prefix that holds Drogon + ONNX Runtime — never
    # all of /usr/local (huge, system-polluted, slow to tar). A cache hit
    # restores the whole prefix intact, so the build steps below can be skipped
    # safely. Cold build is ~10 min once; subsequent runs restore in seconds.
    - name: Cache Drogon + ONNX Runtime prefix
      id: deps-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.cpp-deps
        key: cppdeps-drogon1.9.12-ort1.28.0-${{ runner.os }}-${{ runner.arch }}

    - name: Build + install Drogon v1.9.12 (into prefix)
      if: steps.deps-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        PREFIX="${{ github.workspace }}/.cpp-deps"
        cd /tmp
        git clone --depth 1 --branch v1.9.12 https://github.com/drogonframework/drogon.git
        cd drogon && git submodule update --init
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                 -DBUILD_EXAMPLES=OFF -DBUILD_CTL=OFF -DBUILD_ORM=OFF \
                 -DBUILD_POSTGRESQL=OFF -DBUILD_MYSQL=OFF -DBUILD_SQLITE=OFF \
                 -DBUILD_REDIS=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
        make -j"$(nproc)"
        make install

    - name: Install ONNX Runtime 1.28.0 x64 (into prefix)
      if: steps.deps-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        PREFIX="${{ github.workspace }}/.cpp-deps"
        mkdir -p "$PREFIX/include" "$PREFIX/lib"
        cd /tmp
        wget -q "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz" -O ort.tgz
        # Must match the x64 ORT_SHA256 pinned in CMakeLists.txt for the same
        # ORT_VERSION — this copy had drifted, and every job using this action
        # failed the checksum before a single file was compiled. Refresh BOTH
        # whenever the version changes.
        echo "a3e1b79d7bb1bf09696ce675f49e4064e6c81f6202b8225624fff0e93f8d6407  ort.tgz" | sha256sum -c -
        tar xzf ort.tgz
        cp -r onnxruntime-linux-x64-1.28.0/include/* "$PREFIX/include/"
        cp onnxruntime-linux-x64-1.28.0/lib/libonnxruntime.so* "$PREFIX/lib/"

    # Publish the prefix so every later step in the job (and cmake) finds it.
    - name: Export prefix to environment
      shell: bash
      run: |
        PREFIX="${{ github.workspace }}/.cpp-deps"
        echo "CMAKE_PREFIX_PATH=$PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

    # PDFium (vendored in third_party/) + fastpdf2png for the pdf_renderer TU.
    # Vendored copy on amd64 — no network, fast — so run every time (not cached).
    - name: Install PDFium + fastpdf2png
      shell: bash
      run: |
        TARGETARCH=amd64 bash scripts/setup/install_pdfium.sh
        sudo cp third_party/pdfium/lib/libpdfium.so /usr/lib/
        TARGETARCH=amd64 bash scripts/setup/install_fastpdf2png.sh || true
        sudo cp bin/libpdfium.so /usr/lib/ 2>/dev/null || true
        sudo ldconfig
