<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Whole-page OCR throughput on one RTX 5090: TurboOCR 678 images per second on FUNSD vs 2 to 6 for other engines">
